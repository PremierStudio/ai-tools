name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'

jobs:
  # ============================================================================
  # STAGE 1: VALIDATION
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run fmt:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run tests with coverage gate
        run: npm run test:coverage

  # ============================================================================
  # STAGE 1.5: NON-BLOCKING CROSS-PLATFORM SMOKE (PRE-PUBLISH)
  # ============================================================================
  smoke-cli-preflight:
    name: Smoke ai-tools preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test packed ai-tools package
        run: npm run test:smoke

  # ============================================================================
  # STAGE 2: SECURITY
  # ============================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Run npm audit
        run: npm audit --audit-level high
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          AUDIT_OUTPUT=$(npm audit --json || true)
          HIGH_VULNS=$(echo "$AUDIT_OUTPUT" | jq '.metadata.vulnerabilities.high // 0')
          CRITICAL_VULNS=$(echo "$AUDIT_OUTPUT" | jq '.metadata.vulnerabilities.critical // 0')

          if [ "$HIGH_VULNS" -gt 0 ] || [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "⚠️ Found $HIGH_VULNS high and $CRITICAL_VULNS critical vulnerabilities"
            echo "Review with: npm audit"
          else
            echo "✅ No high or critical vulnerabilities found"
          fi

  # ============================================================================
  # STAGE 3: PUBLISH (main branch only, on push)
  # ============================================================================
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, smoke-cli-preflight, security-audit]
    outputs:
      publish_ready: ${{ steps.publish.outputs.publish_ready }}
    if: |
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, '[skip ci]')

    permissions:
      contents: write
      id-token: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Publish via semantic-release
        id: publish
        run: node scripts/run-semantic-release.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          ALLOW_MISSING_INITIAL_NPM_TOKEN: 'true'

  # ============================================================================
  # STAGE 4: POST-PUBLISH SMOKE TESTS
  # ============================================================================
  smoke-cli:
    name: Smoke ai-tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [publish-npm]
    if: |
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      needs.publish-npm.outputs.publish_ready == 'true'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Wait for npm propagation and smoke-test ai-tools
        run: |
          node -e "
          const { spawnSync } = require('node:child_process');

          function runAiTools() {
            return spawnSync('npx', ['--yes', '@premierstudio/ai-tools@latest', '--help'], {
              encoding: 'utf-8',
              shell: true,
            });
          }

          const maxAttempts = 8;
          for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
            const result = runAiTools();
            const output = (result.stdout || '') + (result.stderr || '');
            const ok = result.status === 0 && /ai-tools\s+-\s+Unified CLI/.test(output);

            if (ok) {
              console.log('ai-tools smoke test passed');
              process.exit(0);
            }

            console.log('attempt ' + attempt + '/' + maxAttempts + ' failed');
            if (attempt < maxAttempts) {
              const waitMs = 15000;
              Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, waitMs);
            }
          }

          console.error('ai-tools smoke test failed after retries');
          process.exit(1);
          "
